[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rules",
    "crates/model",
    "crates/extract",
    "crates/pipeline",
    "crates/store",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
repository = "https://github.com/wolfoftyreso-debug/skattjakt"

[workspace.dependencies]
skattjakt-core = { path = "crates/core" }
skattjakt-rules = { path = "crates/rules" }
skattjakt-model = { path = "crates/model" }
skattjakt-extract = { path = "crates/extract" }
skattjakt-pipeline = { path = "crates/pipeline" }
skattjakt-store = { path = "crates/store" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

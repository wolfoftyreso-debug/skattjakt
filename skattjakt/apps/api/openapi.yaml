openapi: 3.1.0

info:
  title: Skattjakt API
  version: 0.1.0
  summary: Tax Recovery & Opportunity Engine for Swedish limited companies
  description: |
    Skattjakt analyses a Swedish limited company's year-end material and returns
    a structured list of things worth investigating — potential tax positions,
    deductions, accruals, misclassifications and control points.

    This contract is the source of truth for the HTTP surface (section 17).

    **What Skattjakt is not.** It is not a bookkeeping system, a filing system,
    an audit, or legal advice. It issues no binding tax opinion and guarantees
    no saving. Every response carries a `disclaimer` field saying so, and
    clients must display it.

    **How to read a finding.** An `opportunity` is a question worth asking, not
    a conclusion. Its `status` says how far the system got:

      - `identified`   — strong evidence and a reviewed rule.
      - `investigate`  — a potential opportunity, information missing.
      - `verify`       — the rule or calculation needs checking. Everything
                         produced by the rule set shipped today lands here or
                         lower, because that rule set has not been reviewed by
                         a qualified adviser.
      - `warning`      — something to look at, whether or not it saves money.
      - `rejected`     — did not survive falsification; retained for audit.

    **Money is always an interval.** `impact` has `low` and `high` bounds in
    öre. There is no single-figure field, by design.

  contact:
    name: Skattjakt
  license:
    name: UNLICENSED

servers:
  - url: https://api.skattjakt.example/
    description: Production
  - url: http://localhost:8080/
    description: Local

tags:
  - name: Health
    description: Liveness and readiness, for orchestration.
  - name: Analysis
    description: Running an analysis and reading its result.
  - name: Rules
    description: Inspecting the rule set an analysis ran under.
  - name: Companies
    description: Tenants and their credentials.
  - name: Documents
    description: Immutable uploads.

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      description: Returns 200 whenever the process is running. Never touches a dependency.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        The scrape endpoint, in the Prometheus text exposition format 0.0.4.

        Unauthenticated, and safe to be: every value on it is PUBLIC by
        construction, because the metrics registry refuses a label above that
        classification and rejects unbounded label names outright. No company
        id, no analysis id, no org number and no amount can appear here.

        In the cluster it is reachable only from the monitoring namespace; the
        NetworkPolicy is what closes it, so a scrape does not need a credential
        to rotate.
      security: []
      responses:
        "200":
          description: The current values of every registered metric.
          content:
            text/plain:
              schema: { type: string }

  /ready:
    get:
      tags: [Health]
      summary: Readiness
      description: |
        Returns 200 only when the service can actually serve an analysis: the
        rule set loaded and validated, and a model provider is configured.
        Returns 503 with the specific reasons otherwise, so a failing readiness
        check is diagnosable without shell access.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready. `reasons` lists what is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /v1/openapi.yaml:
    get:
      tags: [Health]
      summary: This contract
      security: []
      responses:
        "200":
          description: The OpenAPI document the running build was compiled with.
          content:
            application/yaml:
              schema: { type: string }

  /v1/rules:
    get:
      tags: [Rules]
      summary: List the rule set
      description: |
        Every rule with its citation and review state. Exposed deliberately:
        a user is entitled to know which rules were applied to their accounts
        and which of those have been professionally reviewed.
      responses:
        "200":
          description: The rule set in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleSetSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/analyses:
    post:
      tags: [Analysis]
      summary: Analyse a company's material
      description: |
        Runs the full pipeline — extraction, discovery, rule evaluation,
        falsification, confidence and priority — and returns the result
        synchronously, without storing anything.

        This is the stateless mode, available with or without a database. When a
        database is configured, prefer `POST /v1/documents` followed by
        `POST /v1/analyses/stored`, which persists the analysis and lets it run
        in the background.

        Documents are supplied inline as UTF-8 text or base64. Every document
        must declare its `mime_type`; the bytes are checked against it, and a
        mismatch is rejected rather than guessed at.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisRequest" }
      responses:
        "200":
          description: The analysis completed. An empty finding list is a valid result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisResult" }
        "400":
          description: |
            The request could not be analysed — an invalid organisationsnummer,
            an unreadable document, or a fiscal year the rule set does not
            cover. The rule set gap is reported explicitly rather than
            returning an empty analysis (section 31).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The request exceeded the size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/auth/sign-in:
    post:
      tags: [Sessions]
      summary: Sign in and open a session
      description: |
        Exchanges an email address and password for an access token and a
        refresh token, bound to a device.

        Send `x-skattjakt-client: web | ios | android`. It selects the session
        lifetimes: a browser cannot hold a secret away from script on its own
        page, so a web refresh token lives 12 hours, while iOS and Android put
        it in the Keychain or the Keystore and get 30 days.

        **A web client is not given its tokens.** With
        `x-skattjakt-client: web` they are set as `HttpOnly` cookies and the
        body carries `auth: "cookie"` instead. That is the point: a refresh
        token script can read is a refresh token an XSS can steal, and a stolen
        refresh token is weeks of access.

        iOS and Android get `auth: "bearer"` and the tokens in the body,
        because the Keychain and the Keystore are a better place than a cookie
        jar.

        **Cookie requests must carry `x-skattjakt-client`.** The server refuses
        to honour a cookie without it. Another site can make a browser send the
        cookie; it cannot make it send a custom header without a CORS preflight
        this API never grants. That, plus `SameSite=Strict`, is the CSRF
        defence.

        Send a stable `install_id` your installation generates once and keeps.
        Without it every sign-in creates a new device row, and the customer's
        device list fills with duplicates of the same phone.

        A wrong password and an unknown address return the identical body.
        The difference would enumerate which businesses are customers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                install_id:
                  type: string
                  maxLength: 200
                  description: Stable per-installation identifier.
                device_name:
                  type: string
                  maxLength: 120
                  description: Shown in the customer's device list.
      responses:
        "201":
          description: A session was opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: The credentials are not valid.
        "429":
          description: Too many failed attempts; the account is locked for a while.

  /v1/auth/refresh:
    post:
      tags: [Sessions]
      summary: Exchange a refresh token for a new pair
      description: |
        Rotates. The presented refresh token stops working and a new pair is
        returned.

        A web client sends **no body**: its refresh token is in an `HttpOnly`
        cookie the browser attaches on its own. A native client sends the token
        in the body. The response follows how the token *arrived*, not a
        header — so a native client that omits `x-skattjakt-client` still gets
        a usable token rather than cookies it cannot read.

        **Serialise refreshes in the client.** Five concurrent 401s must not
        become five refreshes: each rotates, so four would look like a replayed
        token and the whole session family would be revoked.

        Presenting a refresh token that was already rotated away revokes the
        **whole session family** — that is what a stolen token looks like, and
        the customer signing in again is the intended outcome. A short grace
        window exempts the immediately previous token, so a response lost to a
        tunnel does not cost a sign-in.

        Expired, revoked, unknown and reuse-detected all answer 401 with the
        same body: every one of them means "sign in again", and telling a thief
        which they hit is free intelligence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: A new pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Sign in again.

  /v1/auth/sign-out:
    post:
      tags: [Sessions]
      summary: End this session
      responses:
        "204": { description: The session was ended. }

  /v1/auth/sign-out-everywhere:
    post:
      tags: [Sessions]
      summary: End every session for this user
      description: What a customer reaches for when a device is lost.
      responses:
        "200":
          description: How many sessions were ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions_ended: { type: integer }

  /v1/auth/devices:
    get:
      tags: [Sessions]
      summary: The devices this user is signed in on
      responses:
        "200":
          description: The device list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }

  /v1/auth/devices/{id}/push-token:
    put:
      tags: [Sessions]
      summary: Register or clear a push token
      description: |
        `push_token: null` clears it — how a client says notifications were
        turned off without removing the device the customer can still see.

        Scoped to the signed-in user, so knowing another customer's device id
        is not enough to redirect their notifications; that answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                push_token: { type: string, nullable: true }
                provider:
                  type: string
                  enum: [apns, fcm, web_push]
                  nullable: true
      responses:
        "204": { description: Registered. }
        "404": { description: No such device. }
        "422": { description: A token was sent without naming its provider. }

  /v1/auth/switch-company:
    post:
      tags: [Sessions]
      summary: Change which company this session acts in
      description: |
        For an accountant with several clients — the normal case in this market.
        Membership is verified rather than trusted from the request, and the
        tokens are not rotated: the session keeps its credentials and changes
        which tenant it acts in.

        A company the caller is not a member of answers 404, not 403: whether it
        exists is not their business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id]
              properties:
                company_id: { type: string, format: uuid }
      responses:
        "200":
          description: The session now acts in that company.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "404": { description: No such company, or you are not a member. }

  /v1/auth/change-password:
    post:
      tags: [Sessions]
      summary: Change this user's password
      description: |
        Requires the current password even though the caller holds a session: a
        borrowed unlocked laptop must not be a permanent account takeover.

        Ends every **other** session. A password change after a suspected
        compromise that leaves the attacker signed in is theatre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  other_sessions_ended: { type: integer }
        "401": { description: The current password is not correct. }
        "422": { description: The new password does not meet the policy. }

  /v1/users:
    post:
      tags: [Sessions]
      summary: Create a person in this company
      description: |
        Needs the `manage_members` permission, which only an owner has — so a
        member cannot quietly widen access and an advisor cannot invite a
        colleague.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
        "403": { description: Your role may not manage members. }
        "409": { description: An account with that address already exists. }

  /v1/companies:
    post:
      tags: [Companies]
      summary: Create a company and issue its first token
      description: |
        Requires the admin token. Returns a company-scoped bearer token **once** —
        only its SHA-256 is stored, so it cannot be retrieved later.

        The admin token grants no access to any company's data; it can only
        create companies.
      responses:
        "201":
          description: Company created. Save the token.
          content:
            application/json:
              schema:
                type: object
                required: [company_id, api_token]
                properties:
                  company_id: { type: string, format: uuid }
                  name: { type: string }
                  org_number: { type: string }
                  api_token: { type: string }
                  token_label: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not the admin token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company]
              properties:
                company: { $ref: "#/components/schemas/CompanyProfile" }
                token_label: { type: string }

  /v1/companies/me:
    get:
      tags: [Companies]
      summary: The company this token belongs to
      description: |
        There is no `/v1/companies/{id}`: the tenant comes from the credential,
        so an identifier in the path could only ever name the same company or be
        refused.
      responses:
        "200":
          description: The company profile, plus which onboarding questions are unanswered.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/documents:
    get:
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Clamped rather than refused if it is out of range.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: |
            Opaque. Pass `next_cursor` from the previous page; do not construct
            one. Keyset rather than offset, so a document uploaded while you are
            paging does not shift or duplicate later rows.
      tags: [Documents]
      summary: List stored document versions
      responses:
        "200": { description: The company's documents. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }
    post:
      tags: [Documents]
      summary: Upload a document
      description: |
        Stores the bytes immutably and records version 1. The document is parsed
        before it is stored, so a file that cannot be read is refused rather than
        kept as an unusable blob. The storage key is derived from the tenant, the
        document and the content hash — never from the filename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DocumentUpload"
                - type: object
                  properties:
                    kind:
                      type: string
                      enum: [annual_accounts, income_statement, balance_sheet, general_ledger, tax_return]
                    accounts_state: { $ref: "#/components/schemas/AccountsState" }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [document_version_id, sha256]
                properties:
                  document_id: { type: string, format: uuid }
                  document_version_id: { type: string, format: uuid }
                  sha256: { type: string }
                  byte_size: { type: integer }
                  page_count: { type: [integer, "null"] }
                  unreadable_pages:
                    type: array
                    items: { type: integer }
        "400":
          description: Unreadable, unsupported, or not what its content type claims.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/analyses/stored:
    get:
      tags: [Analysis]
      summary: List analyses
      responses:
        "200": { description: The company's analyses, newest first. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }
    post:
      tags: [Analysis]
      summary: Start an analysis over stored documents
      description: |
        Returns immediately with `202`. An analysis can legitimately run for
        minutes at high effort, which is too long to hold a request open — poll
        `GET /v1/analyses/{id}` and watch `stage` advance through the steps of
        the progress display.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_version_ids]
              properties:
                document_version_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                accounts_state: { $ref: "#/components/schemas/AccountsState" }
      responses:
        "202":
          description: Accepted. Poll the returned location.
          content:
            application/json:
              schema:
                type: object
                required: [analysis_id, status, stage]
                properties:
                  analysis_id: { type: string, format: uuid }
                  status: { type: string }
                  stage: { type: string }
                  poll: { type: string }
        "400":
          description: No documents, or a document version this company does not have.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/analyses/{id}:
    get:
      tags: [Analysis]
      summary: Analysis status and result
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            Status, stage, progress and — once finished — the full result. Also
            lists the model runs, with token usage and latency but never any
            reasoning trace.
          content:
            application/json:
              schema:
                type: object
                required: [analysis_id, status, stage]
                properties:
                  analysis_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, running, succeeded, failed] }
                  stage: { $ref: "#/components/schemas/Stage" }
                  progress: { type: number, minimum: 0, maximum: 1 }
                  stage_label: { type: string, description: Swedish label for the progress display. }
                  rule_set_version: { type: string }
                  error: { type: [string, "null"] }
                  model_runs: { type: array, items: { type: object } }
                  result:
                    oneOf:
                      - $ref: "#/components/schemas/AnalysisResult"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/analyses/{id}/opportunities:
    get:
      tags: [Analysis]
      summary: The findings of an analysis
      description: Highest priority first. Rejected findings are not included.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The findings, each with its evidence chain.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/analyses/{id}/report:
    get:
      tags: [Analysis]
      summary: The report
      description: The nine sections of the beta report. `?format=markdown` renders it for export.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, markdown] } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { type: object }
            text/markdown:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The analysis has not finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/opportunities/{id}:
    get:
      tags: [Analysis]
      summary: One finding, with its full evidence chain
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The finding. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A bearer token scoped to one company. The token determines the tenant;
        a company identifier in the request body never widens that scope.

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        No such resource for this company. Returned rather than 403 for a
        resource belonging to another tenant — whether it exists elsewhere is
        not the caller's business.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NoPersistence:
      description: |
        No database is configured, so this endpoint cannot work. The stateless
        `POST /v1/analyses` with inline documents remains available.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: |
        Every error body, as `application/problem+json`.

        **Branch on `code`.** It is a stable machine-readable string and the set
        of possible values is pinned by a test, so it cannot change without a
        deliberate contract update. `detail` is prose written for a person and
        will be translated; branching on it breaks the day it is.
      required: [code, title, detail, status]
      properties:
        code:
          type: string
          enum:
            - account_temporarily_locked
            - admin_credential_required
            - already_exists
            - analysis_failed
            - analysis_is_not_finished
            - authentication_unavailable
            - insufficient_permission
            - internal_error
            - invalid_credentials
            - invalid_cursor
            - no_company
            - not_a_session
            - not_found
            - password_rejected
            - persistence_is_not_configured
            - provider_required
            - rate_limited
            - storage_failure
            - the_job_queue_is_not_configured
            - the_session_cannot_be_refreshed
            - unauthorized
            - unknown_push_provider
            - unknown_role
            - wrong_credential
        title: { type: string }
        detail:
          type: string
          description: Safe to show a customer.
        status: { type: integer }

    Session:
      type: object
      description: |
        An issued pair. Both tokens are opaque and are stored only as SHA-256,
        so neither can be recovered from a database dump.
      properties:
        auth:
          type: string
          enum: [cookie, bearer]
          description: |
            `cookie` — the tokens are in `HttpOnly` cookies and are absent from
            this body. `bearer` — they are below, for the Keychain or Keystore.
        access_token:
          type: string
          description: "Bearer clients only. Send as `Authorization: Bearer`. Short-lived."
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          description: |
            Bearer clients only. Store in the Keychain (iOS) or the Keystore
            (Android). Single-use: each refresh rotates it. A web client never
            receives this — it is in an `HttpOnly` cookie.
        refresh_expires_at: { type: string, format: date-time }
        company_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        device_id: { type: string, format: uuid }

    Role:
      type: string
      enum: [owner, member, advisor]
      description: |
        `owner` — the business; everything, including deletion.
        `member` — works in the business; runs and reads analyses.
        `advisor` — an external accountant; may read the accounts and run the
        analysis they were engaged to interpret, and may not delete data or
        hand access to anyone else.

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [web, ios, android] }
        display_name: { type: string }
        last_seen_at: { type: string, format: date-time }
        push_ready: { type: boolean }
        live_sessions: { type: integer }
        current:
          type: boolean
          description: Whether this is the device making the request.
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string, example: "0.1.0" }

    Readiness:
      type: object
      required: [ready, rule_set_version, reasons]
      properties:
        ready: { type: boolean }
        rule_set_version:
          type: [string, "null"]
          description: Version of the rule set in force, or null if it failed to load.
          example: se-2025.1
        model_provider:
          type: [string, "null"]
          description: Configured provider, or null if none is configured.
        reasons:
          type: array
          description: Why the service is not ready. Empty when it is.
          items: { type: string }

    Problem:
      type: object
      required: [title, detail]
      properties:
        title: { type: string, example: "invalid organisationsnummer" }
        detail: { type: string }

    RuleSetSummary:
      type: object
      required: [version, jurisdiction, rules]
      properties:
        version: { type: string, example: se-2025.1 }
        jurisdiction: { type: string, example: SE }
        unreviewed_count:
          type: integer
          description: |
            How many rules have not been professionally reviewed. While this is
            above zero, no finding can be presented as established.
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleSummary" }

    RuleSummary:
      type: object
      required: [rule_id, version, title, category, source, reviewed]
      properties:
        rule_id: { type: string, example: se.tax.periodiseringsfond.outnyttjat_utrymme }
        version: { type: string, example: "2025.1" }
        title: { type: string, example: Periodiseringsfond }
        category: { $ref: "#/components/schemas/Category" }
        tax_year_from: { type: integer }
        tax_year_to: { type: [integer, "null"] }
        source:
          type: string
          description: Primary legal source.
          example: "Inkomstskattelagen (1999:1229) 30 kap. 5–6 §§"
        reviewed:
          type: boolean
          description: Whether a qualified adviser has verified this rule.
        review_note:
          type: [string, "null"]
          description: What remains unverified, when it has not been reviewed.

    AnalysisRequest:
      type: object
      required: [company, documents]
      properties:
        company: { $ref: "#/components/schemas/CompanyProfile" }
        documents:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DocumentUpload" }
        accounts_state:
          $ref: "#/components/schemas/AccountsState"

    CompanyProfile:
      type: object
      required: [name, org_number, fiscal_year]
      description: |
        Only `name`, `org_number` and `fiscal_year` are required. Every other
        field is a question onboarding may not have asked yet; omitting one
        means "unknown", which is treated differently from "no" — a rule that
        depends on it becomes undecidable rather than silently not applying.
      properties:
        name: { type: string, example: Konsultbyrån Nord AB }
        org_number:
          type: string
          description: Swedish organisationsnummer. Any separator; the checksum is validated.
          example: "556016-0680"
        fiscal_year:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        industry: { type: [string, "null"] }
        sni_code: { type: [string, "null"] }
        employee_count: { type: [integer, "null"] }
        owner_count: { type: [integer, "null"] }
        in_group: { type: [boolean, "null"] }
        operations_outside_sweden: { type: [boolean, "null"] }
        does_development_work: { type: [boolean, "null"] }
        owns_premises: { type: [boolean, "null"] }
        has_vehicles: { type: [boolean, "null"] }
        owners_active_in_company: { type: [boolean, "null"] }

    DocumentUpload:
      type: object
      required: [filename, mime_type]
      description: Exactly one of `text` or `content_base64` must be supplied.
      properties:
        filename: { type: string, example: bokslut-2025.pdf }
        mime_type:
          type: string
          enum: [application/pdf, text/csv, text/plain, application/sie]
        text:
          type: [string, "null"]
          description: UTF-8 content, for text formats.
        content_base64:
          type: [string, "null"]
          description: Base64-encoded bytes, for binary formats such as PDF.

    AccountsState:
      type: string
      enum: [preliminary, final, unknown]
      default: preliminary
      description: |
        Whether the accounts are settled. A preliminary year-end is the primary
        case Skattjakt is built for, and it changes what may be concluded.

    Stage:
      type: string
      description: The steps shown while an analysis runs.
      enum: [queued, reading_documents, understanding_structure, identifying_areas,
             searching_opportunities, checking_rules, falsifying,
             verifying_calculations, prioritising, done]

    Category:
      type: string
      enum: [tax, costs, vat, personnel, investments, research_and_development, risk]

    Status:
      type: string
      enum: [identified, investigate, verify, warning, rejected]

    Money:
      type: integer
      format: int64
      description: An exact amount in öre (1/100 SEK). Never a float.
      example: 5150000

    MoneyRange:
      type: object
      required: [low, high]
      description: An estimate interval. Skattjakt never states a single figure.
      properties:
        low: { $ref: "#/components/schemas/Money" }
        high: { $ref: "#/components/schemas/Money" }

    AnalysisResult:
      type: object
      required: [analysis_id, summary, opportunities, warnings, missing_information,
                 covered_areas, recommended_actions, limitations, disclaimer, generated_at]
      properties:
        analysis_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        summary: { $ref: "#/components/schemas/AnalysisSummary" }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/Opportunity" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        missing_information:
          type: array
          description: What would make the analysis better, and what each gap would unlock.
          items: { $ref: "#/components/schemas/MissingInformation" }
        covered_areas:
          type: array
          description: |
            Which areas were checked and how many rules ran in each. Present
            even when nothing was found — "we looked here" is part of the
            result (section 32).
          items: { $ref: "#/components/schemas/CoveredArea" }
        recommended_actions:
          type: array
          maxItems: 3
          description: The questions to take to the accountant, highest priority first.
          items: { type: string }
        limitations:
          type: array
          description: What the system cannot determine.
          items:
            type: object
            required: [statement]
            properties:
              statement: { type: string }
        rejected:
          type: array
          description: Findings falsification removed. Retained for the audit trail.
          items: { $ref: "#/components/schemas/Opportunity" }
        disclaimer:
          type: string
          description: Must be displayed to the user.
        generated_at: { type: string, format: date-time }

    AnalysisSummary:
      type: object
      required: [identified_opportunities, high_priority_count, needs_investigation_count,
                 missing_information_count, warnings_count, estimated_total, found_nothing]
      properties:
        identified_opportunities: { type: integer }
        high_priority_count: { type: integer }
        needs_investigation_count: { type: integer }
        missing_information_count: { type: integer }
        warnings_count: { type: integer }
        estimated_total:
          allOf: [{ $ref: "#/components/schemas/MoneyRange" }]
          description: |
            Sum of the findings the system stands behind. Rejected and
            non-actionable findings contribute nothing.
        found_nothing:
          type: boolean
          description: |
            True when nothing cleared the bar. Render the designed empty state,
            not a blank page: it means the evidence was not strong enough to
            flag anything, not that there is nothing to find.

    Opportunity:
      type: object
      required: [id, category, status, title, rationale, impact, evidence,
                 recommended_action, confidence, risk, effort, urgency, priority]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/Category" }
        status: { $ref: "#/components/schemas/Status" }
        title: { type: string, example: Periodiseringsfond }
        rationale:
          type: string
          description: Why this was flagged, in plain language.
        impact: { $ref: "#/components/schemas/MoneyRange" }
        evidence:
          type: array
          description: |
            The chain from stored document to stated conclusion. An opportunity
            presented as actionable always contains at least one
            `document_value` and one `rule`.
          items: { $ref: "#/components/schemas/EvidenceItem" }
        missing_information:
          type: array
          items: { type: string }
        recommended_action:
          type: string
          description: The next step, usually a question for the accountant.
        confidence: { $ref: "#/components/schemas/Confidence" }
        risk: { type: string, enum: [low, medium, high] }
        effort: { type: string, enum: [low, medium, high] }
        urgency: { type: string, enum: [routine, before_year_end, before_filing] }
        priority: { $ref: "#/components/schemas/Priority" }
        rule_ids:
          type: array
          items: { type: string }
        rejection_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    Confidence:
      type: object
      required: [score, band]
      description: |
        Computed from six measured factors, never taken from the model. Below
        the `not_actionable` threshold a finding is never presented as
        something to act on.
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        band: { type: string, enum: [strong, good, investigate, not_actionable] }

    Priority:
      type: object
      required: [score, band]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        band: { type: string, enum: [high, should_investigate, needs_more_evidence] }

    EvidenceItem:
      oneOf:
        - $ref: "#/components/schemas/EvidenceDocumentValue"
        - $ref: "#/components/schemas/EvidenceRule"
        - $ref: "#/components/schemas/EvidenceCalculation"
        - $ref: "#/components/schemas/EvidenceModelJudgement"
        - $ref: "#/components/schemas/EvidenceAssumption"
      discriminator:
        propertyName: type

    EvidenceDocumentValue:
      type: object
      required: [type, document_version_id, kind, value]
      properties:
        type: { type: string, const: document_value }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        fact_id: { type: string, format: uuid }
        kind: { type: string, example: taxable_result }
        value: { $ref: "#/components/schemas/Money" }
        page: { type: [integer, "null"] }
        excerpt:
          type: [string, "null"]
          description: The line the value was read from, verbatim.

    EvidenceRule:
      type: object
      required: [type, rule_id, rule_version, title, source]
      properties:
        type: { type: string, const: rule }
        rule_id: { type: string }
        rule_version: { type: string }
        title: { type: string }
        source: { type: string }

    EvidenceCalculation:
      type: object
      required: [type, method, inputs, result_low, result_high]
      properties:
        type: { type: string, const: calculation }
        calculation_id: { type: string, format: uuid }
        method: { type: string }
        inputs:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { $ref: "#/components/schemas/Money" }
        result_low: { $ref: "#/components/schemas/Money" }
        result_high: { $ref: "#/components/schemas/Money" }

    EvidenceModelJudgement:
      type: object
      required: [type, task, rationale_summary]
      description: |
        A model pass that contributed a judgement. Never the sole support for
        an actionable finding. Reasoning traces are not stored or returned.
      properties:
        type: { type: string, const: model_judgement }
        model_run_id: { type: string, format: uuid }
        task: { type: string, example: opportunity_discovery }
        rationale_summary: { type: string }

    EvidenceAssumption:
      type: object
      required: [type, statement]
      properties:
        type: { type: string, const: assumption }
        statement: { type: string }

    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: unreadable_page }
        message: { type: string }
        detail: { type: [string, "null"] }

    MissingInformation:
      type: object
      required: [code, description, unlocks]
      properties:
        code: { type: string, example: profile_question }
        description: { type: string }
        unlocks:
          type: string
          description: What answering this would make possible.

    CoveredArea:
      type: object
      required: [category, rules_evaluated, findings]
      properties:
        category: { type: string, example: Skatt }
        rules_evaluated: { type: integer }
        findings: { type: integer }

security:
  - bearerAuth: []

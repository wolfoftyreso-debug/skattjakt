openapi: 3.1.0

info:
  title: Skattjakt API
  version: 0.1.0
  summary: Tax Recovery & Opportunity Engine for Swedish limited companies
  description: |
    Skattjakt analyses a Swedish limited company's year-end material and returns
    a structured list of things worth investigating — potential tax positions,
    deductions, accruals, misclassifications and control points.

    This contract is the source of truth for the HTTP surface (section 17).

    **What Skattjakt is not.** It is not a bookkeeping system, a filing system,
    an audit, or legal advice. It issues no binding tax opinion and guarantees
    no saving. Every response carries a `disclaimer` field saying so, and
    clients must display it.

    **How to read a finding.** An `opportunity` is a question worth asking, not
    a conclusion. Its `status` says how far the system got:

      - `identified`   — strong evidence and a reviewed rule.
      - `investigate`  — a potential opportunity, information missing.
      - `verify`       — the rule or calculation needs checking. Everything
                         produced by the rule set shipped today lands here or
                         lower, because that rule set has not been reviewed by
                         a qualified adviser.
      - `warning`      — something to look at, whether or not it saves money.
      - `rejected`     — did not survive falsification; retained for audit.

    **Money is always an interval.** `impact` has `low` and `high` bounds in
    öre. There is no single-figure field, by design.

  contact:
    name: Skattjakt
  license:
    name: UNLICENSED

servers:
  - url: https://api.skattjakt.example/
    description: Production
  - url: http://localhost:8080/
    description: Local

tags:
  - name: Health
    description: Liveness and readiness, for orchestration.
  - name: Analysis
    description: Running an analysis and reading its result.
  - name: Rules
    description: Inspecting the rule set an analysis ran under.
  - name: Companies
    description: Tenants and their credentials.
  - name: Documents
    description: Immutable uploads.
  - name: Simulations
    description: |
      A general Monte Carlo layer: define uncertain inputs, calculate outputs
      over them, and read the whole distribution rather than a single figure.
      It knows nothing about tax, and nothing it produces is evidence for a
      finding.

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      description: Returns 200 whenever the process is running. Never touches a dependency.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        The scrape endpoint, in the Prometheus text exposition format 0.0.4.

        Unauthenticated, and safe to be: every value on it is PUBLIC by
        construction, because the metrics registry refuses a label above that
        classification and rejects unbounded label names outright. No company
        id, no analysis id, no org number and no amount can appear here.

        In the cluster it is reachable only from the monitoring namespace; the
        NetworkPolicy is what closes it, so a scrape does not need a credential
        to rotate.
      security: []
      responses:
        "200":
          description: The current values of every registered metric.
          content:
            text/plain:
              schema: { type: string }

  /ready:
    get:
      tags: [Health]
      summary: Readiness
      description: |
        Returns 200 only when the service can actually serve an analysis: the
        rule set loaded and validated, and a model provider is configured.
        Returns 503 with the specific reasons otherwise, so a failing readiness
        check is diagnosable without shell access.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready. `reasons` lists what is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /v1/openapi.yaml:
    get:
      tags: [Health]
      summary: This contract
      security: []
      responses:
        "200":
          description: The OpenAPI document the running build was compiled with.
          content:
            application/yaml:
              schema: { type: string }

  /v1/rules:
    get:
      tags: [Rules]
      summary: List the rule set
      description: |
        Every rule with its citations and review state. Exposed deliberately:
        a user is entitled to know which rules were applied to their accounts,
        which of those have been professionally reviewed, and — per cited
        authority — whether anyone has actually retrieved and checked it.
      responses:
        "200":
          description: The rule set in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleSetSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/shop:
    get:
      tags: [Payments]
      summary: What this deployment sells, at what price, on what terms
      description: |
        Public and unauthenticated: it is the shop window, the interface needs
        it before anyone has signed in, and everything in it is already
        published in prose on `/priser` and `/angerratt`.

        It exists so no client carries its own copy of the prices, the consent
        wording or the list of what is for sale. Three copies of a price is two
        chances to show a customer one thing and charge another.

        `available` is false for a product this build has no rules for — it is
        listed and closed rather than hidden, because a service described on
        `/tjanster` and missing here reads as an oversight rather than a
        decision. Ordering one is refused with `503 product_not_available`.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments_required: { type: boolean }
                  can_take_payment: { type: boolean }
                  cancellation_period_days: { type: integer }
                  consent:
                    type: object
                    properties:
                      wording: { type: string }
                      version: { type: string }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string }
                        price: { type: string }
                        price_ore: { type: integer }
                        audience: { type: string, enum: [private, company, accountant] }
                        available: { type: boolean }

  /v1/orders:
    post:
      tags: [Payments]
      summary: Buy one analysis
      description: |
        Creates an order at the product's current price and starts a Swish
        payment for it. The response carries a `swish_token`, which a phone
        turns into an app switch and a desktop into a QR code.

        The order is written **before** Swish is called, so a request that dies
        between the two leaves a record of what was attempted rather than a
        payment this system knows nothing about.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product:
                  type: string
                  enum: [private_analysis, company_analysis, control_review]
                  description: |
                    Not every product in this list can be bought from every
                    build. A product is sellable only if the rule set contains
                    rules for the kind of taxpayer it serves; one that does not
                    is refused with `503 product_not_available` rather than
                    taking money for an empty report. `private_analysis` is in
                    that state today — the shipped rule set has no
                    private-individual rules.
                delivery:
                  type: string
                  enum: [immediate, after_cancellation_period]
                  default: after_cancellation_period
                  description: |
                    Whether the analysis starts now or after the fourteen-day
                    cancellation period. Omitting it means the cautious one: a
                    consumer who says nothing keeps their right to cancel, and
                    nothing here reads silence as consent.
                accepts_loss_of_cancellation_right:
                  type: boolean
                  default: false
                  description: |
                    Required to be `true` when `delivery` is `immediate`.
                    Distansavtalslagen (2005:59) 2 kap. 11 § 11 asks for two
                    things — express consent to delivery beginning, and an
                    acknowledgement that the right of cancellation is thereby
                    lost — so this is a separate field from `delivery` rather
                    than implied by it. Immediate delivery without it is
                    refused (`consent_required`) rather than quietly downgraded
                    to the safe option, which the buyer would only discover a
                    fortnight later.
                payer_alias:
                  type: [string, "null"]
                  description: |
                    The payer's Swish number, for a payment started somewhere
                    other than the payer's own phone. Omit for the app-switch
                    flow, where the payer identifies themselves in the app.
      responses:
        "201":
          description: The order, and the token that starts the payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { description: "Unknown product.", content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: The payment provider could not be reached. Worth retrying.
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "503":
          description: >
            This deployment cannot take payments
            (`payments_not_configured`), or cannot deliver the product asked
            for (`product_not_available`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /v1/orders/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a paid order within the cancellation period
      description: |
        The other half of the choice at checkout. An order bought with
        `delivery: after_cancellation_period` can be cancelled until the period
        runs out, and the analysis has not started.

        **This does not move money.** The system cannot make refunds — see
        `SKATTJAKT_PAYMENTS.md` — so it records that one is owed and says so,
        rather than reporting a refund no person has made.

        Every way an order can fail to be cancellable answers the same
        `409 order_not_cancellable`, with the reasons listed in the detail.
        Distinguishing them would tell a caller which orders exist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled, and a refund is owed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
                  refund:
                    type: object
                    properties:
                      owed: { type: boolean }
                      amount: { type: string }
                      note: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Not cancellable.
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /v1/orders/{id}:
    get:
      tags: [Payments]
      summary: How far an order has got
      description: |
        Poll this while the payer is in the Swish app. It reads the order and
        does **not** call Swish, so polling faster does not drive traffic at the
        payment provider; the callback and a background sweep are what move it.

        `state` reaches `paid` when the payment has been confirmed **with
        Swish** — never on the strength of a callback body alone.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/payments/swish/callback:
    post:
      tags: [Payments]
      summary: Swish reporting that a payment changed
      description: |
        **Not for clients.** Registered with Swish against the merchant's
        number, and called by them.

        Deliberately unauthenticated, because it carries no authority. The body
        is read for one field — the payment reference — and everything else is
        discarded; the outcome is then established by asking Swish directly. A
        forged or replayed callback therefore causes one outbound lookup and no
        state change.

        Always answers 200. Swish retries anything else, and a retry cannot fix
        what a retry would encounter: anything unsettled here is picked up by
        the reconciliation sweep within a minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Received. Says nothing about what was concluded.

  /v1/analyses:
    post:
      tags: [Analysis]
      summary: Analyse a company's material
      description: |
        Runs the full pipeline — extraction, discovery, rule evaluation,
        falsification, confidence and priority — and returns the result
        synchronously, without storing anything.

        This is the stateless mode, available with or without a database. When a
        database is configured, prefer `POST /v1/documents` followed by
        `POST /v1/analyses/stored`, which persists the analysis and lets it run
        in the background.

        Documents are supplied inline as UTF-8 text or base64. Every document
        must declare its `mime_type`; the bytes are checked against it, and a
        mismatch is rejected rather than guessed at.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisRequest" }
      responses:
        "200":
          description: The analysis completed. An empty finding list is a valid result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisResult" }
        "400":
          description: |
            The request could not be analysed — an invalid organisationsnummer,
            an unreadable document, or a fiscal year the rule set does not
            cover. The rule set gap is reported explicitly rather than
            returning an empty analysis (section 31).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The request exceeded the size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/auth/sign-in:
    post:
      tags: [Sessions]
      summary: Sign in and open a session
      description: |
        Exchanges an email address and password for an access token and a
        refresh token, bound to a device.

        Send `x-skattjakt-client: web | ios | android`. It selects the session
        lifetimes: a browser cannot hold a secret away from script on its own
        page, so a web refresh token lives 12 hours, while iOS and Android put
        it in the Keychain or the Keystore and get 30 days.

        **A web client is not given its tokens.** With
        `x-skattjakt-client: web` they are set as `HttpOnly` cookies and the
        body carries `auth: "cookie"` instead. That is the point: a refresh
        token script can read is a refresh token an XSS can steal, and a stolen
        refresh token is weeks of access.

        iOS and Android get `auth: "bearer"` and the tokens in the body,
        because the Keychain and the Keystore are a better place than a cookie
        jar.

        **Cookie requests must carry `x-skattjakt-client`.** The server refuses
        to honour a cookie without it. Another site can make a browser send the
        cookie; it cannot make it send a custom header without a CORS preflight
        this API never grants. That, plus `SameSite=Strict`, is the CSRF
        defence.

        Send a stable `install_id` your installation generates once and keeps.
        Without it every sign-in creates a new device row, and the customer's
        device list fills with duplicates of the same phone.

        A wrong password and an unknown address return the identical body.
        The difference would enumerate which businesses are customers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                install_id:
                  type: string
                  maxLength: 200
                  description: Stable per-installation identifier.
                device_name:
                  type: string
                  maxLength: 120
                  description: Shown in the customer's device list.
      responses:
        "201":
          description: A session was opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: The credentials are not valid.
        "429":
          description: Too many failed attempts; the account is locked for a while.

  /v1/auth/refresh:
    post:
      tags: [Sessions]
      summary: Exchange a refresh token for a new pair
      description: |
        Rotates. The presented refresh token stops working and a new pair is
        returned.

        A web client sends **no body**: its refresh token is in an `HttpOnly`
        cookie the browser attaches on its own. A native client sends the token
        in the body. The response follows how the token *arrived*, not a
        header — so a native client that omits `x-skattjakt-client` still gets
        a usable token rather than cookies it cannot read.

        **Serialise refreshes in the client.** Five concurrent 401s must not
        become five refreshes: each rotates, so four would look like a replayed
        token and the whole session family would be revoked.

        Presenting a refresh token that was already rotated away revokes the
        **whole session family** — that is what a stolen token looks like, and
        the customer signing in again is the intended outcome. A short grace
        window exempts the immediately previous token, so a response lost to a
        tunnel does not cost a sign-in.

        Expired, revoked, unknown and reuse-detected all answer 401 with the
        same body: every one of them means "sign in again", and telling a thief
        which they hit is free intelligence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: A new pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Sign in again.

  /v1/auth/sign-out:
    post:
      tags: [Sessions]
      summary: End this session
      responses:
        "204": { description: The session was ended. }

  /v1/auth/sign-out-everywhere:
    post:
      tags: [Sessions]
      summary: End every session for this user
      description: What a customer reaches for when a device is lost.
      responses:
        "200":
          description: How many sessions were ended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions_ended: { type: integer }

  /v1/auth/devices:
    get:
      tags: [Sessions]
      summary: The devices this user is signed in on
      responses:
        "200":
          description: The device list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }

  /v1/auth/devices/{id}/push-token:
    put:
      tags: [Sessions]
      summary: Register or clear a push token
      description: |
        `push_token: null` clears it — how a client says notifications were
        turned off without removing the device the customer can still see.

        Scoped to the signed-in user, so knowing another customer's device id
        is not enough to redirect their notifications; that answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                push_token: { type: string, nullable: true }
                provider:
                  type: string
                  enum: [apns, fcm, web_push]
                  nullable: true
      responses:
        "204": { description: Registered. }
        "404": { description: No such device. }
        "422": { description: A token was sent without naming its provider. }

  /v1/auth/switch-company:
    post:
      tags: [Sessions]
      summary: Change which company this session acts in
      description: |
        For an accountant with several clients — the normal case in this market.
        Membership is verified rather than trusted from the request, and the
        tokens are not rotated: the session keeps its credentials and changes
        which tenant it acts in.

        A company the caller is not a member of answers 404, not 403: whether it
        exists is not their business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id]
              properties:
                company_id: { type: string, format: uuid }
      responses:
        "200":
          description: The session now acts in that company.
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "404": { description: No such company, or you are not a member. }

  /v1/auth/change-password:
    post:
      tags: [Sessions]
      summary: Change this user's password
      description: |
        Requires the current password even though the caller holds a session: a
        borrowed unlocked laptop must not be a permanent account takeover.

        Ends every **other** session. A password change after a suspected
        compromise that leaves the attacker signed in is theatre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  other_sessions_ended: { type: integer }
        "401": { description: The current password is not correct. }
        "422": { description: The new password does not meet the policy. }

  /v1/users:
    post:
      tags: [Sessions]
      summary: Create a person in this company
      description: |
        Needs the `manage_members` permission, which only an owner has — so a
        member cannot quietly widen access and an advisor cannot invite a
        colleague.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
        "403": { description: Your role may not manage members. }
        "409": { description: An account with that address already exists. }

  /v1/documents/tickets:
    post:
      tags: [Documents]
      summary: Ask for an upload ticket
      description: |
        The flow a phone uses. A 30 MB scanned annual report posted as JSON
        crosses a mobile network, is buffered whole in an API pod, and any drop
        in the last second means starting again.

        ```
        POST /v1/documents/tickets                → ticket_id + upload_url
        PUT  <upload_url>                          → the bytes
        POST /v1/documents/tickets/{id}/complete   → document_version_id
        ```

        `upload_method` is `direct` when object storage can issue a presigned
        URL — send the bytes there with **no credential**, the URL is
        self-contained — or `proxied` when it cannot, in which case
        `upload_url` is a path on this API and needs the usual authorisation.
        Client code is the same either way.

        The proxied `POST /v1/documents` is unchanged and remains the right
        shape for a browser posting a small text file.

        **Size.** A ticket accepts up to 5 GB, because the bytes go to storage
        and this API never holds them. The proxied path stays at 32 MB, which is
        what a process can buffer. Two numbers, two paths, and the difference
        between them is the difference between a file and a request.

        **Type.** Any. The declared `mime_type` is recorded and decides nothing:
        the bytes are identified on arrival, so a `.pdf` that is really a JPEG
        is read as a JPEG. A type with no extractor is still stored and hashed,
        and the analysis reports what it was and why nothing was read from it —
        `document_not_read` among the report's warnings.

        **Reading.** The extractor holds at most 64 MB. A larger file is read to
        that and the report carries `document_truncated` naming how much of it
        the analysis rested on. Nothing here can hold 5 GB in memory, and a
        prefix that says it is a prefix beats an out-of-memory kill.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mime_type, size]
              properties:
                filename: { type: string, maxLength: 400 }
                mime_type:
                  type: string
                  enum: [application/pdf, text/plain, text/csv, image/jpeg, image/png]
                  description: An allowlist. Anything else answers 415.
                size:
                  type: integer
                  description: |
                    **Bytes, not characters.** The distinction bites here: a
                    Swedish document contains å, ä and ö, two bytes each in
                    UTF-8, so a client counting characters declares a size that
                    is always too small and every upload is refused. The
                    mismatch error names both numbers.
                kind: { type: string, default: annual_accounts }
                accounts_state: { type: string, default: preliminary }
      responses:
        "201":
          description: A ticket, valid for 30 minutes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket_id: { type: string, format: uuid }
                  document_id: { type: string, format: uuid }
                  upload_url: { type: string }
                  upload_method: { type: string, enum: [direct, proxied] }
                  expires_at: { type: string, format: date-time }
        "413": { description: Larger than the 32 MB ceiling. }
        "415": { description: Not a supported document type. }
        "429": { description: The tenant's upload quota is spent. }

  /v1/documents/tickets/{id}/complete:
    post:
      tags: [Documents]
      summary: Redeem a ticket
      description: |
        Reads what actually landed in storage and checks it against the ticket.
        The size and hash come from storage, never from the client — asking the
        client what it uploaded and believing the answer would make every check
        decorative.

        A ticket is single use. Unknown, expired, already-used and
        belonging-to-another-tenant all answer 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The document version the upload became.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_version_id: { type: string, format: uuid }
                  sha256: { type: string }
                  byte_size: { type: integer }
        "404": { description: No such ticket, or it is spent. }
        "409": { description: The ticket exists but nothing was uploaded to it. }
        "422": { description: What arrived is not what the ticket declared. }

  /v1/documents/tickets/{id}/content:
    put:
      tags: [Documents]
      summary: Upload through the API
      description: |
        The `proxied` path, for a deployment with no object storage to sign a
        URL. The bytes go through the API — which is what the ticket flow
        exists to avoid — so this is a single-node convenience, not the path a
        phone should take against a real deployment.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Stored. }
        "404": { description: No such ticket, or it is spent. }
        "413": { description: Larger than the 32 MB ceiling. }

  /v1/notifications:
    get:
      tags: [Documents]
      summary: In-app notifications
      description: |
        Delivery for the in-app channel *is* this endpoint: there is nothing to
        transmit, so a client reads what the outbox holds.

        Carries an identifier and a kind, never prose and never an amount — the
        same rule as a push payload.
      responses:
        "200":
          description: The most recent notifications, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string }
                        subject_id: { type: string, format: uuid, nullable: true }

  /v1/simulations:
    post:
      tags: [Simulations]
      summary: Define a Monte Carlo model
      description: |
        Creates a simulation and its first version. The body is the model: named
        inputs with probability distributions, and named outputs written as
        expressions over them.

        The model is compiled before it is stored, so an expression that does
        not parse or a distribution whose parameters are impossible is a 422 now
        rather than a run that fails every time anyone presses the button.

        **A simulation is not a finding.** It describes the assumptions someone
        entered, not the company's accounts, and nothing it produces may become
        the amount on an `opportunity`. See `/v1/simulations/{id}/results`.
      responses:
        "201":
          description: The model was stored and can be run.
          content:
            application/json:
              schema:
                type: object
                required: [id, version, spec_hash]
                properties:
                  id: { type: string, format: uuid }
                  version: { type: integer }
                  spec_hash:
                    type: string
                    description: SHA-256 of the canonical model, recorded on every run.
                  engine_version: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The role does not carry `RunSimulation`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: The model cannot run. `detail` names the input or output.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationSpec" }
    get:
      tags: [Simulations]
      summary: List simulations
      description: Cursor-paginated, newest first.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: One page of simulations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulations: { type: array, items: { type: object } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/simulations/distributions:
    get:
      tags: [Simulations]
      summary: The distributions the engine offers, and its limits
      description: |
        Returned by the server so a client does not carry its own copy of the
        list. A duplicated catalogue is one that drifts, and a client offering a
        distribution the engine does not implement is a 422 the user cannot
        explain.

        Each entry carries a Swedish label and one sentence of guidance on when
        the distribution is the right choice — a picker that offers eleven names
        and no help is one whose users pick Normal for everything, including the
        quantities that cannot go below zero.
      responses:
        "200":
          description: The catalogue and the engine's bounds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  distributions:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        label: { type: string }
                        guidance: { type: string }
                        parameters: { type: array, items: { type: object } }
                  limits: { type: object }
                  engine_version: { type: string }
                  disclaimer: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/simulations/{id}:
    get:
      tags: [Simulations]
      summary: One model, its derived input summary, and its runs
      description: |
        `inputs` carries each input's mean, standard deviation and support —
        **computed from the distribution rather than stored beside it**, so they
        cannot disagree with what will actually be sampled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The model, its inputs and outputs, and up to 20 recent runs.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation — the same answer as for another tenant's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/simulations/{id}/versions:
    post:
      tags: [Simulations]
      summary: Add a version of a model
      description: |
        Append-only. Earlier versions keep working and earlier runs keep
        meaning what they meant: a run references a version, never a
        simulation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The new version number.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: The model cannot run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationSpec" }

  /v1/simulations/{id}/run:
    post:
      tags: [Simulations]
      summary: Run the model
      description: |
        **Where it runs is decided by size, and the response says which way it
        went.** A small run answers inside the request with `200` and the whole
        result; a large one returns `202`, a `run_id` and a URL to poll. A round
        trip through a queue for eighty milliseconds of arithmetic is latency
        with nothing to show for it, and a two-minute computation inside an HTTP
        request dies with the first rolling deploy.

        **The seed is a string.** A JSON number silently loses precision above
        2^53, so a client would round-trip a seed, send it back, and get a
        different simulation with no error anywhere. Requests may send a number
        for convenience; responses always return a string. Omit it and the
        server draws one and records it — a run whose seed was not written down
        cannot be reproduced.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run finished inside the request. The whole result is here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationResult" }
        "202":
          description: Queued. Poll `/v1/simulations/{id}/results?run=…`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string, format: uuid }
                  job_id: { type: string, format: uuid }
                  state: { type: string, enum: [queued] }
                  seed: { type: string }
                  iterations: { type: integer }
                  poll: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            The run has no answer — an output that produced an infinity, a
            constraint no draw can satisfy, an iteration count outside the
            engine's bounds. `detail` names the output and the iteration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            Temporary, and the request itself is fine. Either the server is
            already running as many simulations as it will answer directly
            (`too_many_simulations_at_once`), or this one passed the deadline
            for an inline run (`simulation_too_slow_to_answer_directly`).

            In both cases the same model at a higher iteration count is queued
            and runs in the background, which is the documented way out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                iterations:
                  type: integer
                  minimum: 100
                  maximum: 10000000
                  default: 10000
                seed:
                  oneOf: [{ type: string }, { type: integer }]
                  description: Decimal string. Omit to have one drawn and recorded.
                reason:
                  type: string
                  description: Why this run was made. Stored on the run and in the audit trail.

  /v1/simulations/{id}/cancel:
    post:
      tags: [Simulations]
      summary: Stop a run
      description: |
        A request rather than an act: the worker holding the run polls for it and
        stops at the end of its current batch, so the response is `202` and the
        state is `cancelling`. A run that had already finished answers `200`
        with `cancelled: false` — the caller got what they wanted and nothing
        was stopped, and a client that reported a cancellation here would be
        reporting one that did not happen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run had already finished. Nothing was cancelled.
        "202":
          description: Cancellation requested.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation or run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/simulations/{id}/results:
    get:
      tags: [Simulations]
      summary: A run's state, statistics and chart data
      description: |
        Defaults to the most recent run; `?run=` names an older one, which is how
        a scenario comparison reads both sides.

        A run that has not finished returns its progress and **no numbers**.
        Partial statistics would be a result from a sample whose size the caller
        has no way to know.

        `shapes` is the visualisation payload: a histogram, a density curve and a
        sampled cumulative distribution. About four kilobytes per output whether
        the run was a thousand iterations or ten million — the raw samples are
        never stored or sent, and are reproducible from the seed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation or run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/simulations/{id}/statistics:
    get:
      tags: [Simulations]
      summary: The statistics for a run
      description: |
        Mean, median, spread and every percentile from P5 to P99, plus the
        probabilities the model's targets and thresholds ask for.

        `probability_of_target` is **absent** when no target was set. It is never
        zero for that reason: "no target" and "impossible" are different
        statements, and a default of 0 turns the first into the second on every
        screen that reads it.

        `mean_confidence_interval_95` is the interval for the **mean** — this
        run's sampling error — not the spread of the outcomes. The two are
        indistinguishable once they are numbers on a screen, so the field name
        carries the distinction.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: One entry per output.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation or run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/simulations/{id}/sensitivity:
    get:
      tags: [Simulations]
      summary: Which inputs drive the uncertainty
      description: |
        Pearson correlation, Spearman rank correlation, and each input's share of
        the explained variance — which is the form the question is usually asked
        in: "how much of the uncertainty comes from this?"

        Read the rank correlation when the two disagree. An input with a strong
        but curved effect — a threshold, a cap, anything with an `if` in it — can
        show a Pearson correlation near zero while dominating the outcome.

        `correlation` is **null**, not zero, where none exists: a constant input,
        or one the output's expression never reads. Zero would read as "measured,
        and it does not matter".
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: One entry per input per output, ranked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation or run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/simulations/{id}/convergence:
    get:
      tags: [Simulations]
      summary: Whether the run has settled
      description: |
        The mean, median, P10 and P90 as they stood at 1 000, 10 000, 100 000 …
        iterations. If the median moved by four per cent between a hundred
        thousand and a million, the third significant figure on the screen is
        noise, `stable` is false, and `warning` says so in Swedish.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The checkpoint series per output, and its verdict.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such simulation or run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/simulations/{id}/audit:
    get:
      tags: [Simulations]
      summary: Who ran what, when, with which seed and which model
      description: |
        The trail of section 13: creation, every version, every run requested,
        completed or cancelled — each with the actor, the seed, the engine
        version and the model hash that produced it.

        Requires `ReadAuditTrail`, which an advisor does not hold.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The events, oldest first.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The role does not carry `ReadAuditTrail`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such simulation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/companies:
    post:
      tags: [Companies]
      summary: Create a company and issue its first token
      description: |
        Requires the admin token. Returns a company-scoped bearer token **once** —
        only its SHA-256 is stored, so it cannot be retrieved later.

        The admin token grants no access to any company's data; it can only
        create companies.
      responses:
        "201":
          description: Company created. Save the token.
          content:
            application/json:
              schema:
                type: object
                required: [company_id, api_token]
                properties:
                  company_id: { type: string, format: uuid }
                  name: { type: string }
                  org_number: { type: string }
                  api_token: { type: string }
                  token_label: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not the admin token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "501": { $ref: "#/components/responses/NoPersistence" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company]
              properties:
                company: { $ref: "#/components/schemas/CompanyProfile" }
                token_label: { type: string }

  /v1/companies/me:
    get:
      tags: [Companies]
      summary: The company this token belongs to
      description: |
        There is no `/v1/companies/{id}`: the tenant comes from the credential,
        so an identifier in the path could only ever name the same company or be
        refused.
      responses:
        "200":
          description: The company profile, plus which onboarding questions are unanswered.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/documents:
    get:
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Clamped rather than refused if it is out of range.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: |
            Opaque. Pass `next_cursor` from the previous page; do not construct
            one. Keyset rather than offset, so a document uploaded while you are
            paging does not shift or duplicate later rows.
      tags: [Documents]
      summary: List stored document versions
      responses:
        "200": { description: The company's documents. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }
    post:
      tags: [Documents]
      summary: Upload a document
      description: |
        Stores the bytes immutably and records version 1. The document is parsed
        before it is stored, so a file that cannot be read is refused rather than
        kept as an unusable blob. The storage key is derived from the tenant, the
        document and the content hash — never from the filename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DocumentUpload"
                - type: object
                  properties:
                    kind:
                      type: string
                      enum: [annual_accounts, income_statement, balance_sheet, general_ledger, tax_return]
                    accounts_state: { $ref: "#/components/schemas/AccountsState" }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [document_version_id, sha256]
                properties:
                  document_id: { type: string, format: uuid }
                  document_version_id: { type: string, format: uuid }
                  sha256: { type: string }
                  byte_size: { type: integer }
                  page_count: { type: [integer, "null"] }
                  unreadable_pages:
                    type: array
                    items: { type: integer }
        "400":
          description: Unreadable, unsupported, or not what its content type claims.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/analyses/stored:
    get:
      tags: [Analysis]
      summary: List analyses
      responses:
        "200": { description: The company's analyses, newest first. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }
    post:
      tags: [Analysis]
      summary: Start an analysis over stored documents
      description: |
        Returns immediately with `202`. An analysis can legitimately run for
        minutes at high effort, which is too long to hold a request open — poll
        `GET /v1/analyses/{id}` and watch `stage` advance through the steps of
        the progress display.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_version_ids]
              properties:
                document_version_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                accounts_state: { $ref: "#/components/schemas/AccountsState" }
      responses:
        "202":
          description: >
            Accepted. Poll the returned location. `duplicate_of` is present when
            this request did not create new work: either the derived idempotency
            key matched a job already queued, or the `order_id` names an order
            that has already bought an analysis — a spent order answers with the
            analysis it bought rather than refusing, because the caller has
            already paid.
          content:
            application/json:
              schema:
                type: object
                required: [analysis_id, status, stage]
                properties:
                  analysis_id: { type: string, format: uuid }
                  status: { type: string }
                  stage: { type: string }
                  duplicate_of: { type: string, format: uuid }
                  poll: { type: string }
        "400":
          description: No documents, or a document version this company does not have.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NoPersistence" }

  /v1/analyses/{id}:
    get:
      tags: [Analysis]
      summary: Analysis status and result
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: |
            Status, stage, progress and — once finished — the full result. Also
            lists the model runs, with token usage and latency but never any
            reasoning trace.
          content:
            application/json:
              schema:
                type: object
                required: [analysis_id, status, stage]
                properties:
                  analysis_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, running, succeeded, failed] }
                  stage: { $ref: "#/components/schemas/Stage" }
                  progress: { type: number, minimum: 0, maximum: 1 }
                  stage_label: { type: string, description: Swedish label for the progress display. }
                  rule_set_version: { type: string }
                  error: { type: [string, "null"] }
                  model_runs: { type: array, items: { type: object } }
                  result:
                    oneOf:
                      - $ref: "#/components/schemas/AnalysisResult"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/analyses/{id}/opportunities:
    get:
      tags: [Analysis]
      summary: The findings of an analysis
      description: Highest priority first. Rejected findings are not included.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The findings, each with its evidence chain.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/analyses/{id}/report:
    get:
      tags: [Analysis]
      summary: The report
      description: |
        The nine sections of the beta report, plus an ordered action plan.
        `?format=markdown` renders it for export.

        `?audience=` selects the presentation layer. **The analysis behind all
        three is the same one** — same rules, same evidence, same status ladder
        — so two audiences can never disagree about what was found.

        What actually differs, stated plainly because this used to promise more
        than it delivered:

        * `accountant` adds `control_review` — what must be checked before
          filing, what might be improved, what was checked and cleared, and what
          is worth raising with the client. This is the whole of the difference
          between the products.
        * `sections.audience` names the layer, so a saved report can be told
          apart from another.
        * **Nothing else.** `private` and `company` return byte-identical
          reports apart from that label. An earlier version of this document
          described `private` as "written for someone reading about their own
          affairs", which was never built. `tests/e2e/end-to-end.sh` §16B runs a
          real analysis through all three and asserts the difference is exactly
          the control review and the label — so this description cannot drift
          from the code again in either direction.

        `private` is in any case not sellable by this build: the rule set has no
        private-individual rules, so `POST /v1/orders` refuses it.

        An unrecognised value is a 400 rather than a silent fall back to the
        default: a caller asking for `accountant` and quietly receiving the
        company view would ship a review with no control section in it.

        **The parameter does not choose what you are entitled to.** When an
        analysis was bought — that is, when payments were required and an order
        was redeemed against it — the layer is fixed at redemption from the
        product on the order, and `?audience=` may only agree with it. Asking
        for a different one is a 403. Otherwise a customer who paid 29 kr for
        Privatanalys could ask for the 69 kr Kontroll report and get it.

        There is no ladder: Bolagsanalys and Skattjakt Kontroll cost the same
        and are different reports, not more and less of one report. You get the
        layer you bought. When payments are not required nothing was bought, and
        the parameter chooses freely.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, markdown] } }
        - name: audience
          in: query
          required: false
          schema: { type: string, enum: [private, company, accountant], default: company }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { type: object }
            text/markdown:
              schema: { type: string }
        "400":
          description: The audience is not one this build knows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            A layer other than the one this analysis was bought as
            (`not_what_was_bought`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The analysis has not finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/opportunities/{id}:
    get:
      tags: [Analysis]
      summary: One finding, with its full evidence chain
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The finding. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A bearer token scoped to one company. The token determines the tenant;
        a company identifier in the request body never widens that scope.

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        No such resource for this company. Returned rather than 403 for a
        resource belonging to another tenant — whether it exists elsewhere is
        not the caller's business.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NoPersistence:
      description: |
        No database is configured, so this endpoint cannot work. The stateless
        `POST /v1/analyses` with inline documents remains available.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    SimulationSpec:
      type: object
      required: [name, inputs, outputs]
      description: |
        A Monte Carlo model. At most 64 inputs and 16 outputs; the second bound
        exists because each output retains its full sample vector for exact
        percentiles, so it bounds the engine's memory alongside the iteration
        count.
      properties:
        name: { type: string }
        description: { type: string }
        note:
          type: string
          description: Why this version exists. Stored on the version, not the model.
        inputs:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/SimulationInput" }
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/SimulationOutput" }

    SimulationInput:
      type: object
      required: [id, name, distribution]
      description: |
        One uncertain quantity.

        Note what is **not** here: `mean`, `median`, `min`, `max` and `std_dev`
        are not stored fields. They are derived from the distribution and
        returned on `GET /v1/simulations/{id}`. A stored mean beside a stored
        distribution is two sources of truth for one fact, and the day someone
        edits the standard deviation without editing the mean is the day the
        interface starts lying.
      properties:
        id:
          type: string
          description: |
            The name used in expressions. Letters, digits and underscores;
            must not be a reserved word of the expression language
            (`if`, `and`, `or`, `not`, `pi`, `e`, `true`, `false`).
        name: { type: string }
        distribution: { $ref: "#/components/schemas/Distribution" }
        unit: { type: string }
        source:
          type: string
          description: Where the number came from. A model whose inputs have no stated source is one nobody can defend afterwards.
        stated_certainty: { $ref: "#/components/schemas/StatedCertainty" }
        description: { type: string }
        constraints:
          type: object
          description: |
            A permitted range. `resample` truncates the distribution — what an
            analyst usually means by "it cannot be negative". `clamp` censors it,
            piling probability mass onto the bounds; sometimes right, and never
            right by accident.
          properties:
            min: { type: number }
            max: { type: number }
            mode: { type: string, enum: [resample, clamp], default: resample }

    SimulationOutput:
      type: object
      required: [id, name, expression]
      properties:
        id: { type: string }
        name: { type: string }
        expression:
          type: string
          description: |
            An expression over the input identifiers and over any output declared
            *before* this one — which is what makes `profit = revenue - costs`
            work while making a circular reference an unknown-name error.

            Operators `+ - * / % ^`, comparisons, `and`/`or`/`not`, and the
            functions `min max abs sqrt exp ln log10 floor ceil round clamp` plus
            `if(condition, a, b)`. No loops, no assignment, no I/O: it terminates
            because it cannot do otherwise.
        unit: { type: string }
        description: { type: string }
        target:
          type: number
          description: Reported as a probability of reaching it, never as a verdict.
        target_direction: { type: string, enum: [at_least, at_most], default: at_least }
        critical_threshold:
          type: number
          description: Reported as the probability of falling below it.

    Distribution:
      type: object
      required: [kind]
      description: |
        Tagged by `kind`. An unknown kind is a parse error rather than a default.
        Fetch the catalogue from `/v1/simulations/distributions` rather than
        hard-coding this list in a client.
      properties:
        kind:
          type: string
          enum:
            [normal, lognormal, uniform, triangular, beta, exponential,
             poisson, bernoulli, binomial, discrete, custom]
        mean: { type: number, description: normal }
        std_dev: { type: number, description: normal — zero is allowed and means the input is certain }
        log_mean: { type: number, description: lognormal — parameter of the *underlying normal* }
        log_std_dev: { type: number, description: lognormal — parameter of the underlying normal }
        low: { type: number, description: uniform, triangular, beta }
        high: { type: number, description: uniform, triangular, beta }
        mode: { type: number, description: triangular }
        alpha: { type: number, description: beta }
        beta: { type: number, description: beta }
        rate: { type: number, description: exponential }
        lambda: { type: number, description: poisson }
        p: { type: number, description: bernoulli, binomial }
        trials: { type: integer, description: binomial }
        values: { type: array, items: { type: number }, description: discrete }
        weights: { type: array, items: { type: number }, description: discrete }
        points:
          type: array
          description: |
            custom — `[value, cumulative_probability]` pairs in increasing order,
            starting at 0 and ending at 1. Inverted piecewise-linearly, which is
            what an analyst means by "a 30% chance of being under 100".
          items:
            type: array
            items: { type: number }

    SimulationResult:
      type: object
      description: |
        A run. `statistics` and `shapes` are null until it succeeds.

        Every result carries `disclaimer`, and clients must display it: this
        describes the model somebody defined, not the world. A probability is
        never a verdict.
      properties:
        run_id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        seed: { type: string, description: Decimal string, so 64 bits survive JSON. }
        iterations: { type: integer }
        completed_iterations: { type: integer }
        progress: { type: number, minimum: 0, maximum: 1 }
        engine_version:
          type: string
          description: |
            Bumped whenever a change could alter the numbers a given seed
            produces. A result from an older engine is marked unreproducible on
            this one rather than silently recomputed into different figures.
        spec_hash: { type: string }
        execution: { type: string, enum: [inline, queued] }
        duration_ms: { type: integer, nullable: true }
        iterations_per_second: { type: number, nullable: true }
        quality:
          type: object
          nullable: true
          description: Rejected draws, clamped samples and convergence warnings. Qualifies the result.
        error: { type: string, nullable: true }
        disclaimer: { type: string }
        statistics:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/OutputStatistics" }
        shapes:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/OutputShape" }

    OutputStatistics:
      type: object
      properties:
        output_id: { type: string }
        name: { type: string }
        unit: { type: string, nullable: true }
        count: { type: integer }
        mean: { type: number }
        median: { type: number }
        min: { type: number }
        max: { type: number }
        std_dev: { type: number }
        variance: { type: number }
        p5: { type: number }
        p10: { type: number }
        p25: { type: number }
        p50: { type: number }
        p75: { type: number }
        p90: { type: number }
        p95: { type: number }
        p99: { type: number }
        probability_of_target:
          type: number
          nullable: true
          description: Absent when no target was set. Never zero for that reason.
        probability_of_loss: { type: number }
        probability_below_threshold: { type: number, nullable: true }
        probability_above_threshold: { type: number, nullable: true }
        mean_confidence_interval_95:
          type: array
          nullable: true
          description: For the **mean** — this run's sampling error, not the spread of outcomes.
          items: { type: number }
        relative_standard_error: { type: number, nullable: true }

    OutputShape:
      type: object
      description: The chart payload. Bounded in size regardless of the iteration count.
      properties:
        output_id: { type: string }
        bins:
          type: array
          items:
            type: object
            properties:
              low: { type: number }
              high: { type: number }
              count: { type: integer }
              share: { type: number }
        density:
          type: array
          description: A smoothed density at each bin centre, on the same axis as `share`. Empty when the output is constant.
          items: { type: number }
        cdf:
          type: array
          description: 201 points. Reads as "there is an X% chance the result is at most Y".
          items:
            type: object
            properties:
              value: { type: number }
              probability: { type: number }

    Problem:
      type: object
      description: |
        Every error body, as `application/problem+json`.

        **Branch on `code`.** It is a stable machine-readable string and the set
        of possible values is pinned by a test, so it cannot change without a
        deliberate contract update. `detail` is prose written for a person and
        will be translated; branching on it breaks the day it is.
      required: [code, title, detail, status]
      properties:
        code:
          type: string
          enum:
            - account_temporarily_locked
            - admin_credential_required
            - already_exists
            - ambiguous_document
            - analysis_failed
            - analysis_is_not_finished
            - authentication_unavailable
            - consent_required
            - document_too_large
            - empty_document
            - insufficient_permission
            - internal_error
            - invalid_accounts_state
            - invalid_base64
            - invalid_credentials
            - invalid_cursor
            - invalid_fiscal_year
            - invalid_idempotency_key
            - invalid_organisationsnummer
            - invalid_request
            - invalid_simulation_model
            - no_company
            - no_documents
            - not_a_session
            - not_found
            - not_what_was_bought
            - nothing_was_uploaded
            - order_not_cancellable
            - order_not_deliverable_yet
            - order_not_payable
            - password_rejected
            - payment_provider_unavailable
            - payment_rejected
            - payment_required
            - payments_not_configured
            - persistence_is_not_configured
            - product_not_available
            - provider_required
            - rate_limited
            - simulation_cancelled
            - simulation_cannot_run
            - simulation_too_slow_to_answer_directly
            - storage_failure
            - tax_year_not_covered
            - the_job_queue_is_not_configured
            - the_session_cannot_be_refreshed
            - the_upload_does_not_match_its_ticket
            - too_many_simulations_at_once
            - unauthorized
            - unknown_audience
            - unknown_delivery_choice
            - unknown_document
            - unknown_product
            - unknown_push_provider
            - unknown_role
            - unknown_value
            - unreadable_document
            - unsupported_document_type
            - wrong_credential
        title: { type: string }
        detail:
          type: string
          description: Safe to show a customer.
        status: { type: integer }

    Session:
      type: object
      description: |
        An issued pair. Both tokens are opaque and are stored only as SHA-256,
        so neither can be recovered from a database dump.
      properties:
        auth:
          type: string
          enum: [cookie, bearer]
          description: |
            `cookie` — the tokens are in `HttpOnly` cookies and are absent from
            this body. `bearer` — they are below, for the Keychain or Keystore.
        access_token:
          type: string
          description: "Bearer clients only. Send as `Authorization: Bearer`. Short-lived."
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          description: |
            Bearer clients only. Store in the Keychain (iOS) or the Keystore
            (Android). Single-use: each refresh rotates it. A web client never
            receives this — it is in an `HttpOnly` cookie.
        refresh_expires_at: { type: string, format: date-time }
        company_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        device_id: { type: string, format: uuid }

    Role:
      type: string
      enum: [owner, member, advisor]
      description: |
        `owner` — the business; everything, including deletion.
        `member` — works in the business; runs and reads analyses.
        `advisor` — an external accountant; may read the accounts and run the
        analysis they were engaged to interpret, and may not delete data or
        hand access to anyone else.

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [web, ios, android] }
        display_name: { type: string }
        last_seen_at: { type: string, format: date-time }
        push_ready: { type: boolean }
        live_sessions: { type: integer }
        current:
          type: boolean
          description: Whether this is the device making the request.
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string, example: "0.1.0" }

    Readiness:
      type: object
      required: [ready, rule_set_version, reasons]
      properties:
        ready: { type: boolean }
        rule_set_version:
          type: [string, "null"]
          description: Version of the rule set in force, or null if it failed to load.
          example: se-2025.1
        model_provider:
          type: [string, "null"]
          description: Configured provider, or null if none is configured.
        reasons:
          type: array
          description: Why the service is not ready. Empty when it is.
          items: { type: string }

    Order:
      type: object
      required: [order_id, product, amount_ore, amount, currency, state, audience]
      properties:
        order_id: { type: string, format: uuid }
        product:
          type: string
          enum: [private_analysis, company_analysis, control_review]
        amount_ore:
          type: integer
          description: The price charged, in öre. Copied onto the order when it was
            created, so a later price change never rewrites what somebody was asked
            to pay.
        amount: { type: string, example: "69,00 kr" }
        currency: { type: string, const: SEK }
        state:
          type: string
          enum: [created, awaiting_payment, paid, declined, failed, consumed, refund_owed]
          description: |
            * `paid` — confirmed with Swish, not yet used.
            * `consumed` — it bought the analysis named in `analysis_id`. One
              order buys exactly one, enforced by the database rather than by a
              handler.
            * `refund_owed` — paid, and what it bought could not be delivered. A
              person owes the customer money; the system cannot make a refund
              and says so rather than pretending.
        audience:
          type: string
          description: Which presentation layer this product buys.
          enum: [private, company, accountant]
        analysis_id: { type: [string, "null"], format: uuid }
        note: { type: [string, "null"] }
        swish_token:
          type: [string, "null"]
          description: |
            Present only in the response that created the order. Turn it into an
            app switch (`swish://paymentrequest?token=…`) on a phone, or a QR
            code on a desktop.

    RuleSetSummary:
      type: object
      required: [version, jurisdiction, rules]
      properties:
        version: { type: string, example: se-2025.1 }
        jurisdiction: { type: string, example: SE }
        unreviewed_count:
          type: integer
          description: |
            How many rules have not been professionally reviewed. While this is
            above zero, no finding can be presented as established.
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleSummary" }

    RuleSummary:
      type: object
      required: [rule_id, version, title, category, sources, source_state, reviewed]
      properties:
        rule_id: { type: string, example: se.tax.periodiseringsfond.outnyttjat_utrymme }
        version: { type: string, example: "2025.1" }
        title: { type: string, example: Periodiseringsfond }
        category: { $ref: "#/components/schemas/Category" }
        tax_year_from: { type: integer }
        tax_year_to: { type: [integer, "null"] }
        sources:
          type: array
          minItems: 1
          description: |
            Every legal authority this rule rests on, each with how far it has
            been checked. A rule cannot be loaded with an empty list.
          items: { $ref: "#/components/schemas/SourceSummary" }
        source_state:
          $ref: "#/components/schemas/SourceState"
        reviewed:
          type: boolean
          description: Whether a qualified adviser has verified this rule.
        review_note:
          type: [string, "null"]
          description: What remains unverified, when it has not been reviewed.

    SourceSummary:
      type: object
      required: [id, reference, authority, claim, state]
      properties:
        id: { type: string, example: il-30-5 }
        reference:
          type: string
          description: Citation as a reader would write it.
          example: "Inkomstskattelag (1999:1229) 30 kap. 5 §"
        authority: { type: string, example: Sveriges riksdag }
        url:
          type: [string, "null"]
          description: Where a human can read it.
        claim:
          type: string
          description: What the rule assumes this authority says.
        state: { $ref: "#/components/schemas/SourceState" }
        retrieved_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the source was last fetched. Always null unless `state` is
            `verified` or `mismatch`.

    SourceState:
      type: string
      enum: [unretrieved, unreachable, mismatch, verified]
      description: |
        How far a source has been checked, weakest first.

        A rule's own `source_state` is the weakest of the sources it cites,
        with one exception: `mismatch` dominates. A rule citing one contradicted
        paragraph and one unreachable one reports `mismatch`, not `unreachable`
        — otherwise a network failure would hide evidence that the rule is
        wrong.

        * `unretrieved` — nobody has fetched it.
        * `unreachable` — a fetch was attempted and failed. A fact about the
          network, not about the law.
        * `mismatch` — it was fetched and does **not** say what the rule
          assumes. The law moved, or the rule was wrong when written; findings
          from such a rule are capped at `investigate`.
        * `verified` — it was fetched and does. Recorded with a timestamp and a
          hash of the retrieved text.

        The state is read from the retrieval record the verification sweep
        writes, not from what the binary was built with, so it answers "has
        anybody checked this" as of now. Every source in the shipped set is
        currently `unretrieved`: the statute hosts are unreachable from the
        build environment.

    AnalysisRequest:
      type: object
      required: [company, documents]
      properties:
        company: { $ref: "#/components/schemas/CompanyProfile" }
        documents:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DocumentUpload" }
        accounts_state:
          $ref: "#/components/schemas/AccountsState"

    CompanyProfile:
      type: object
      required: [name, org_number, fiscal_year]
      description: |
        Only `name`, `org_number` and `fiscal_year` are required. Every other
        field is a question onboarding may not have asked yet; omitting one
        means "unknown", which is treated differently from "no" — a rule that
        depends on it becomes undecidable rather than silently not applying.
      properties:
        name: { type: string, example: Konsultbyrån Nord AB }
        org_number:
          type: string
          description: Swedish organisationsnummer. Any separator; the checksum is validated.
          example: "556016-0680"
        fiscal_year:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        industry: { type: [string, "null"] }
        sni_code: { type: [string, "null"] }
        employee_count: { type: [integer, "null"] }
        owner_count: { type: [integer, "null"] }
        in_group: { type: [boolean, "null"] }
        operations_outside_sweden: { type: [boolean, "null"] }
        does_development_work: { type: [boolean, "null"] }
        owns_premises: { type: [boolean, "null"] }
        has_vehicles: { type: [boolean, "null"] }
        owners_active_in_company: { type: [boolean, "null"] }

    DocumentUpload:
      type: object
      required: [filename, mime_type]
      description: Exactly one of `text` or `content_base64` must be supplied.
      properties:
        filename: { type: string, example: bokslut-2025.pdf }
        mime_type:
          type: string
          enum: [application/pdf, text/csv, text/plain, application/sie]
        text:
          type: [string, "null"]
          description: UTF-8 content, for text formats.
        content_base64:
          type: [string, "null"]
          description: Base64-encoded bytes, for binary formats such as PDF.

    AccountsState:
      type: string
      enum: [preliminary, final, unknown]
      default: preliminary
      description: |
        Whether the accounts are settled. A preliminary year-end is the primary
        case Skattjakt is built for, and it changes what may be concluded.

    Stage:
      type: string
      description: The steps shown while an analysis runs.
      enum: [queued, reading_documents, understanding_structure, identifying_areas,
             searching_opportunities, checking_rules, falsifying,
             verifying_calculations, prioritising, done]

    Category:
      type: string
      enum: [tax, costs, vat, personnel, investments, research_and_development, risk]

    Status:
      type: string
      enum: [identified, investigate, verify, warning, rejected]

    Money:
      type: integer
      format: int64
      description: An exact amount in öre (1/100 SEK). Never a float.
      example: 5150000

    MoneyRange:
      type: object
      required: [low, high]
      description: An estimate interval. Skattjakt never states a single figure.
      properties:
        low: { $ref: "#/components/schemas/Money" }
        high: { $ref: "#/components/schemas/Money" }

    AnalysisResult:
      type: object
      required: [analysis_id, summary, opportunities, warnings, missing_information,
                 covered_areas, recommended_actions, limitations, disclaimer, generated_at]
      properties:
        analysis_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        summary: { $ref: "#/components/schemas/AnalysisSummary" }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/Opportunity" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        missing_information:
          type: array
          description: What would make the analysis better, and what each gap would unlock.
          items: { $ref: "#/components/schemas/MissingInformation" }
        covered_areas:
          type: array
          description: |
            Which areas were checked and how many rules ran in each. Present
            even when nothing was found — "we looked here" is part of the
            result (section 32).
          items: { $ref: "#/components/schemas/CoveredArea" }
        recommended_actions:
          type: array
          maxItems: 3
          description: The questions to take to the accountant, highest priority first.
          items: { type: string }
        limitations:
          type: array
          description: What the system cannot determine.
          items:
            type: object
            required: [statement]
            properties:
              statement: { type: string }
        rejected:
          type: array
          description: Findings falsification removed. Retained for the audit trail.
          items: { $ref: "#/components/schemas/Opportunity" }
        disclaimer:
          type: string
          description: Must be displayed to the user.
        generated_at: { type: string, format: date-time }

    AnalysisSummary:
      type: object
      required: [identified_opportunities, high_priority_count, needs_investigation_count,
                 missing_information_count, warnings_count, estimated_total, found_nothing]
      properties:
        identified_opportunities: { type: integer }
        high_priority_count: { type: integer }
        needs_investigation_count: { type: integer }
        missing_information_count: { type: integer }
        warnings_count: { type: integer }
        estimated_total:
          allOf: [{ $ref: "#/components/schemas/MoneyRange" }]
          description: |
            Sum of the findings the system stands behind. Rejected and
            non-actionable findings contribute nothing.
        found_nothing:
          type: boolean
          description: |
            True when nothing cleared the bar. Render the designed empty state,
            not a blank page: it means the evidence was not strong enough to
            flag anything, not that there is nothing to find.

    Opportunity:
      type: object
      required: [id, category, status, title, rationale, impact, evidence,
                 recommended_action, confidence, risk, effort, urgency, priority]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/Category" }
        status: { $ref: "#/components/schemas/Status" }
        title: { type: string, example: Periodiseringsfond }
        rationale:
          type: string
          description: Why this was flagged, in plain language.
        impact: { $ref: "#/components/schemas/MoneyRange" }
        evidence:
          type: array
          description: |
            The chain from stored document to stated conclusion. An opportunity
            presented as actionable always contains at least one
            `document_value` and one `rule`.
          items: { $ref: "#/components/schemas/EvidenceItem" }
        missing_information:
          type: array
          items: { type: string }
        recommended_action:
          type: string
          description: The next step, usually a question for the accountant.
        confidence: { $ref: "#/components/schemas/Confidence" }
        risk: { type: string, enum: [low, medium, high] }
        effort: { type: string, enum: [low, medium, high] }
        urgency: { type: string, enum: [routine, before_year_end, before_filing] }
        priority: { $ref: "#/components/schemas/Priority" }
        rule_ids:
          type: array
          items: { type: string }
        rejection_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    StatedCertainty:
      type: string
      enum: [low, medium, high]
      description: |
        How much the person who supplied a number believes it.

        Named for who is asserting it, because `Confidence` in this same API
        is something else entirely: a score *this system computes* about a
        finding. This is a claim *the analyst makes* about an input they
        typed in. It is recorded and shown beside the input, and it never
        enters the arithmetic — widening a distribution because someone
        ticked "low" would be the system inventing uncertainty nobody stated.
    Confidence:
      type: object
      required: [score, band]
      description: |
        Computed from six measured factors, never taken from the model. Below
        the `not_actionable` threshold a finding is never presented as
        something to act on.
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        band: { type: string, enum: [strong, good, investigate, not_actionable] }

    Priority:
      type: object
      required: [score, band]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        band: { type: string, enum: [high, should_investigate, needs_more_evidence] }

    EvidenceItem:
      oneOf:
        - $ref: "#/components/schemas/EvidenceDocumentValue"
        - $ref: "#/components/schemas/EvidenceRule"
        - $ref: "#/components/schemas/EvidenceCalculation"
        - $ref: "#/components/schemas/EvidenceModelJudgement"
        - $ref: "#/components/schemas/EvidenceAssumption"
      discriminator:
        propertyName: type

    EvidenceDocumentValue:
      type: object
      required: [type, document_version_id, kind, value]
      properties:
        type: { type: string, const: document_value }
        document_id: { type: string, format: uuid }
        document_version_id: { type: string, format: uuid }
        fact_id: { type: string, format: uuid }
        kind: { type: string, example: taxable_result }
        value: { $ref: "#/components/schemas/Money" }
        page: { type: [integer, "null"] }
        excerpt:
          type: [string, "null"]
          description: The line the value was read from, verbatim.

    EvidenceRule:
      type: object
      required: [type, rule_id, rule_version, title, source]
      properties:
        type: { type: string, const: rule }
        rule_id: { type: string }
        rule_version: { type: string }
        title: { type: string }
        source:
          type: string
          description: |
            Every citation joined with `; `, for a reader who wants one line.
            `citations` carries the same authorities structured, including how
            far each has been checked.
        citations:
          type: array
          description: |
            Always present for analyses run by this version. **Absent** on
            analyses stored before structured citations existed, whose evidence
            carries only the `source` line — the field is omitted rather than
            sent empty, so a client can tell "no citations recorded" from "this
            rule cites nothing", and the second case cannot occur.
          items: { $ref: "#/components/schemas/Citation" }

    Citation:
      type: object
      required: [reference, claim, state]
      description: |
        One legal authority a finding rests on, carried into the report on
        purpose. A reader told a finding rests on `30 kap. 5 §` learns nothing
        about whether anyone has read that paragraph; a reader told it rests on
        one that has never been retrieved learns what the finding is worth.
      properties:
        reference: { type: string, example: "Inkomstskattelag (1999:1229) 30 kap. 5 §" }
        url: { type: [string, "null"] }
        claim:
          type: string
          description: What the rule assumes this authority says.
        state: { $ref: "#/components/schemas/SourceState" }
        retrieved_at: { type: [string, "null"], format: date-time }

    EvidenceCalculation:
      type: object
      required: [type, method, inputs, result_low, result_high]
      properties:
        type: { type: string, const: calculation }
        calculation_id: { type: string, format: uuid }
        method: { type: string }
        inputs:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { $ref: "#/components/schemas/Money" }
        result_low: { $ref: "#/components/schemas/Money" }
        result_high: { $ref: "#/components/schemas/Money" }

    EvidenceModelJudgement:
      type: object
      required: [type, task, rationale_summary]
      description: |
        A model pass that contributed a judgement. Never the sole support for
        an actionable finding. Reasoning traces are not stored or returned.
      properties:
        type: { type: string, const: model_judgement }
        model_run_id: { type: string, format: uuid }
        task: { type: string, example: opportunity_discovery }
        rationale_summary: { type: string }

    EvidenceAssumption:
      type: object
      required: [type, statement]
      properties:
        type: { type: string, const: assumption }
        statement: { type: string }

    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: unreadable_page }
        message: { type: string }
        detail: { type: [string, "null"] }

    MissingInformation:
      type: object
      required: [code, description, unlocks]
      properties:
        code: { type: string, example: profile_question }
        description: { type: string }
        unlocks:
          type: string
          description: What answering this would make possible.

    CoveredArea:
      type: object
      required: [category, rules_evaluated, findings]
      properties:
        category: { type: string, example: Skatt }
        rules_evaluated: { type: integer }
        findings: { type: integer }

security:
  - bearerAuth: []

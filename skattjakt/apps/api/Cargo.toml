[package]
name = "skattjakt-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP surface for Skattjakt, implementing api/openapi.yaml."

[[bin]]
name = "skattjakt-api"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
skattjakt-core.workspace = true
skattjakt-extract.workspace = true
skattjakt-gateway.workspace = true
skattjakt-identity.workspace = true
skattjakt-model.workspace = true
skattjakt-pipeline.workspace = true
skattjakt-rules.workspace = true
skattjakt-jobs.workspace = true
skattjakt-simulate.workspace = true
skattjakt-store.workspace = true
skattjakt-telemetry.workspace = true
getrandom = "0.3"
uuid.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

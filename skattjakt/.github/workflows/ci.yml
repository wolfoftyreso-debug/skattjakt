name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skattjakt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace --all-targets

      # Runs the whole pipeline over ten synthetic companies and fails the build
      # on any false positive or critical-evidence breach.
      - name: Golden dataset
        run: cargo test -p skattjakt-pipeline --test golden -- --nocapture

  tenant-isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      # Starts a real cluster, applies the migrations, and attempts every
      # cross-tenant access the schema allows.
      - name: Isolation checks
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          ./scripts/test-tenant-isolation.sh

  end-to-end:
    name: End-to-end product test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skattjakt

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      - name: Build the API
        run: cargo build --bin skattjakt-api

      # Section 40: create a Swedish AB, upload accounts, analyse, and check the
      # result, evidence, report, audit trail, cross-tenant access,
      # reproducibility and log hygiene — with the API connected as the
      # application role, so row-level security genuinely applies.
      - name: Product test
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./scripts/test-end-to-end.sh

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - name: Validate the contract parses
        run: python3 -c "import yaml,sys; d=yaml.safe_load(open('api/openapi.yaml')); assert d['openapi'].startswith('3.1'); print('paths:', len(d['paths']), 'schemas:', len(d['components']['schemas']))"

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only — publishing is a separate, gated workflow.
      - uses: docker/build-push-action@v6
        with:
          context: skattjakt
          file: skattjakt/deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

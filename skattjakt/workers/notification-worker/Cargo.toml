[package]
name = "skattjakt-notification-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skattjakt-notification-worker"
path = "src/main.rs"

[dependencies]
# `native` explicitly: the workspace turns default features off so the engine
# can cross to wasm32, and this binary is the side that needs the network —
# the Anthropic client and the OTLP exporter.

skattjakt-core.workspace = true
skattjakt-notify.workspace = true
skattjakt-store.workspace = true
skattjakt-telemetry = { workspace = true, features = ["native"] }
anyhow.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true

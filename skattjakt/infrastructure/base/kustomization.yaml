apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is not applied directly. Every environment goes through an overlay,
# which sets the namespace, the replica counts, the image digests and the host.
# There is no "apply the base to production and hope" path.

resources:
  - namespace.yaml
  - networkpolicies.yaml
  - config.yaml
  - postgres.yaml
  - minio.yaml
  - api.yaml
  - worker.yaml
  - backup.yaml
  - backup-scripts.yaml
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: skattjakt
      app.kubernetes.io/managed-by: kustomize

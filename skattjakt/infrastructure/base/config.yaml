# Configuration that is not secret.
#
# Secrets are not here and are not anywhere in this repository (section 30).
# The Secret objects the workloads reference — skattjakt-secrets,
# skattjakt-postgres-secrets, skattjakt-minio-secrets, skattjakt-backup-secrets
# — are created out of band by External Secrets or sealed-secrets. See
# SKATTJAKT_DEPLOYMENT.md. A committed placeholder Secret is worse than none:
# it is the thing that gets applied by accident and then never rotated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skattjakt-config
  namespace: skattjakt
data:
  PORT: "8080"
  RUST_LOG: "skattjakt=info,sqlx=warn,tower_http=warn"

  # No default model id, on purpose (engineering decision D7). Each overlay
  # names the model that deployment should run on, so an upgrade is a reviewed
  # change to a file rather than a surprise from a dependency.
  SKATTJAKT_MODEL_ID: ""

  # Prices, in micro-ore per million tokens. Configuration rather than
  # constants: a price compiled into the binary is wrong the day after the
  # provider changes it, and wrong silently. A model with no entry here cannot
  # be called at all, which is deliberate — an unpriced call is an unbounded
  # call and the budget check would pass for it.
  SKATTJAKT_MODEL_PRICES: "{}"

  # The per-analysis cost ceiling, in SEK (section 69).
  SKATTJAKT_ANALYSIS_BUDGET_SEK: "25"

  # On by default. Financial documents occasionally trip a provider's safety
  # classifiers on entirely benign content, and a refused analysis is a worse
  # outcome for the customer than one served by a sibling model. Nothing is
  # hidden by this: the gateway records every fallback with both model names
  # and SkattjaktModelFallbacks alerts on any occurrence, so a substitution is
  # visible rather than forbidden. Set to "0" where reproducibility outweighs
  # availability.
  SKATTJAKT_MODEL_FALLBACK: "1"

  SKATTJAKT_MODEL_TIMEOUT_SECS: "600"
  SKATTJAKT_MODEL_MAX_RETRIES: "3"
  SKATTJAKT_DB_MAX_CONNECTIONS: "10"
  SKATTJAKT_BLOB_ROOT: "/var/lib/skattjakt/blobs"

  # Where finished spans go. Absent is a supported state: trace ids still reach
  # the log stream, which is what the scheme did before an exporter existed.
  #
  # OTLP over HTTP with JSON, on 4318. The gRPC port is 4317 and would need a
  # protobuf stack for no benefit at this volume — see crates/telemetry/src/otlp.rs.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"

  # --- Payments -------------------------------------------------------------
  #
  # Empty here on purpose. The Swish number and the callback URL are per
  # deployment, and the certificate is a mounted Secret rather than a value —
  # see SKATTJAKT_PAYMENTS.md for what the bank supplies and where each piece
  # goes.
  #
  # `SKATTJAKT_SWISH_PAYEE_ALIAS` empty means payments are off: the order
  # routes refuse rather than pretending, and analyses run without one. Setting
  # `SKATTJAKT_PAYMENTS_REQUIRED` with no provider is a refusal to start, so a
  # half-configured deployment cannot take orders it can never collect on.
  SKATTJAKT_PAYMENTS_REQUIRED: "0"
  SKATTJAKT_SWISH_PAYEE_ALIAS: ""
  # The test environment until an operator says otherwise. Getting this wrong
  # in this direction fails a TLS handshake; the other way moves real money.
  SKATTJAKT_SWISH_BASE_URL: "https://mss.cpc.getswish.net/swish-cpcapi"
  SKATTJAKT_SWISH_CLIENT_PEM: "/etc/skattjakt/swish/client.pem"
  SKATTJAKT_SWISH_CA_PEM: "/etc/skattjakt/swish/swish-ca.pem"
  SKATTJAKT_SWISH_CALLBACK_URL: ""

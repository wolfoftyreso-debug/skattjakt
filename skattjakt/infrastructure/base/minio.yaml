# Object storage, self-hosted (section 5, section 12).
#
# MinIO rather than S3: the build order says self-hosted where a self-hosted
# capability exists, and the application talks to it over the S3 API, so
# nothing in the code changes if that decision is ever revisited.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skattjakt-minio
  namespace: skattjakt
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: skattjakt-minio
  namespace: skattjakt
  labels:
    app.kubernetes.io/name: skattjakt-minio
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: skattjakt-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skattjakt-minio
  namespace: skattjakt
  labels:
    app.kubernetes.io/name: skattjakt-minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: skattjakt
spec:
  serviceName: skattjakt-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skattjakt-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skattjakt-minio
        app.kubernetes.io/component: object-storage
        app.kubernetes.io/part-of: skattjakt
    spec:
      serviceAccountName: skattjakt-minio
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
          args: [server, /data, --console-address, ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: skattjakt-minio-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skattjakt-minio-secrets
                  key: MINIO_ROOT_PASSWORD
            # Documents are HIGHLY_CONFIDENTIAL and are encrypted at rest with
            # a key MinIO never holds in plaintext on disk (section 10). The
            # KES endpoint is set per environment.
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi

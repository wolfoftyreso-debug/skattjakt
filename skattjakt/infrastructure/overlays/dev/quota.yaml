apiVersion: v1
kind: ResourceQuota
metadata:
  name: skattjakt-quota
  namespace: skattjakt
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    requests.storage: 40Gi
    persistentvolumeclaims: "4"
    count/deployments.apps: "10"
    count/statefulsets.apps: "4"
    count/jobs.batch: "20"
    services.loadbalancers: "1"

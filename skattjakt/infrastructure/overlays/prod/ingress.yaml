apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skattjakt
  namespace: skattjakt
spec:
  tls:
    - hosts: [skattjakt.se]
      secretName: skattjakt-tls
  rules:
    - host: skattjakt.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skattjakt-api
                port:
                  name: http

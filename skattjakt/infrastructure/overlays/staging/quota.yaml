apiVersion: v1
kind: ResourceQuota
metadata:
  name: skattjakt-quota
  namespace: skattjakt
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    # 24Gi, not 16Gi. At the autoscaler's ceiling the workload needs 15.9Gi,
    # and the nightly backup and the restore test each want another gigabyte on
    # top of whatever is running at the time. A quota that fits the service
    # exactly is a quota that cancels the backup on a busy night.
    limits.memory: 24Gi
    requests.storage: 100Gi
    persistentvolumeclaims: "6"
    count/deployments.apps: "10"
    count/statefulsets.apps: "4"
    count/jobs.batch: "20"
    services.loadbalancers: "1"

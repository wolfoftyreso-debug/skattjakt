name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# The gates, in the order in which they catch things:
#
#   test            — the code does what it says
#   golden          — the pipeline still finds what it used to, and nothing else
#   tenant-isolation— the database enforces the boundary
#   security        — the API resists the attacks in section 50
#   end-to-end      — the product works from upload to report
#   manifests       — what would be deployed is valid and shaped as intended
#   supply-chain    — what is in the binary is known, checksummed and unaudited
#   container       — the image builds, runs as non-root, and contains no shell
#
# Nothing here is advisory. A job that reports and does not fail is a job that
# is ignored by the third week.

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skattjakt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # The OCR test refuses to skip in CI, so the models have to be here.
      # Fetched by checksum: scripts/fetch-ocr-models.sh rejects a model that
      # does not match and says which one.
      - name: OCR models
        run: ./scripts/fetch-ocr-models.sh models

      - name: Tests
        run: cargo test --workspace --all-targets
        env:
          SKATTJAKT_OCR_MODELS: ${{ github.workspace }}/skattjakt/models

      # Runs the whole pipeline over ten synthetic companies and fails the build
      # on any false positive or critical-evidence breach.
      - name: Golden dataset
        run: cargo test -p skattjakt-pipeline --test golden -- --nocapture

  tenant-isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      # Starts a real cluster, applies the migrations, and attempts every
      # cross-tenant access the schema allows.
      - name: Isolation checks
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          ./tests/security/tenant-isolation.sh

  security:
    name: Security suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skattjakt

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      # Section 50: tenant escape, IDOR, path traversal, SQL injection, SSRF,
      # prompt injection, rate limiting, and what reaches the logs and metrics.
      - name: Attack the running API
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./tests/security/security-suite.sh

      # Sessions, rotation, reuse detection and roles against a live API. The
      # policy is unit-tested; this is the wiring, which is where the bugs that
      # matter live.
      - name: Sessions and roles
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./tests/security/session-suite.sh

  end-to-end:
    name: End-to-end product test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skattjakt

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      # The suite starts two processes, because that is how it is deployed.
      # Building only the API leaves the worker missing and the run fails at
      # the point where the analysis would have been picked up.
      - name: Build the API and the worker
        run: cargo build --bin skattjakt-api --bin skattjakt-analysis-worker

      # Section 40: create a Swedish AB, upload accounts, analyse, and check the
      # result, evidence, report, audit trail, cross-tenant access,
      # reproducibility and log hygiene — with the API connected as the
      # application role, so row-level security genuinely applies.
      - name: Product test
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./tests/e2e/end-to-end.sh

  object-storage:
    name: Storage, notifications and traces
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skattjakt

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      # e2e-on-s3, tracing and notifications all start prebuilt binaries
      # rather than going through cargo, so they have to exist first.
      - name: Build the binaries the suites start
        run: |
          cargo build \
            --bin skattjakt-api \
            --bin skattjakt-analysis-worker \
            --bin skattjakt-notification-worker

      # SigV4 is hand-written, so the only thing that proves a request is
      # well-formed is a server that verifies the signature and refuses when it
      # does not match. This runs one.
      - name: The blob store against a real MinIO
        run: ./tests/integration/s3-blobstore.sh

      # And the whole product against it, because "the client works" and "the
      # product works on this backend" are different claims.
      - name: End-to-end on S3
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./tests/integration/e2e-on-s3.sh

      # An analysis finishes, the outbox row commits with it, the worker
      # delivers, and a real SMTP server receives a message — which is then read
      # back and checked for the figures it must not contain.
      # Only a collector can prove an OTLP body is accepted, and only two
      # processes can prove a trace survives a queue.
      - name: Traces against a real OpenTelemetry collector
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./tests/integration/tracing.sh

      - name: Notifications against a real SMTP server
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./tests/integration/notifications.sh

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - name: Validate the contract parses
        run: |
          python3 -c "
          import yaml
          d = yaml.safe_load(open('apps/api/openapi.yaml'))
          assert d['openapi'].startswith('3.1'), d['openapi']
          print('paths:', len(d['paths']), 'schemas:', len(d['components']['schemas']))
          "

  manifests:
    name: Manifests, migrations and documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      - name: Install kustomize and kubeconform
        run: |
          curl -sSLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz && sudo mv kubeconform /usr/local/bin/

      # Every overlay renders, every rendered object validates against the
      # Kubernetes schemas, and the security properties this deployment depends
      # on are asserted rather than assumed.
      - name: Validate every environment
        run: ./tests/infrastructure/validate-manifests.sh

      # Documentation rots silently. These are the couplings where a stale
      # document actively misleads someone at 03:00: an alert with no runbook
      # section, an alert querying a metric nobody emits, a document pointing
      # at a file that moved.
      # Fresh install *and* upgrade-with-data from every earlier version. Every
      # other suite starts from an empty database, so they answer the first
      # question every time and the second one never.
      - name: Migration safety
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          chmod -R a+rX .
          ./tests/infrastructure/migrations.sh

      - name: Validate the documentation
        run: ./tests/infrastructure/validate-docs.sh

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # What is actually in the binary, with the checksum cargo verified.
      - name: Generate and check the SBOM
        run: |
          ./tests/supply-chain/generate-sbom.py --check Cargo.lock
          ./tests/supply-chain/generate-sbom.py Cargo.lock > sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: skattjakt/sbom.cdx.json

      # .cargo/audit.toml carries two ignores, each with its reason. The first
      # one rests on `rsa` being unreachable — true only while sqlx's MySQL
      # driver stays off, so assert it instead of trusting it. If `rsa` ever
      # enters the build graph the ignore has stopped being honest, and this
      # fails before cargo-audit gets the chance to stay quiet about it.
      - name: Known vulnerabilities
        run: |
          cargo install --locked cargo-audit
          if cargo tree --quiet -i rsa --target all 2>/dev/null | grep -q .; then
            echo "rsa is reachable again; RUSTSEC-2023-0071 can no longer be ignored" >&2
            exit 1
          fi
          cargo audit --deny warnings

      - name: Licences and sources
        run: |
          cargo install --locked cargo-deny
          cargo deny check licenses sources bans

  container:
    name: Container image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skattjakt
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only. Publishing is a separate, gated workflow — a merge to a
      # branch must not be able to put an image where a cluster can pull it.
      - name: Build the notification worker image
        uses: docker/build-push-action@v6
        with:
          context: skattjakt
          file: skattjakt/Dockerfile
          build-args: BINARY=skattjakt-notification-worker
          tags: skattjakt/notification-worker:ci
          load: true

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: skattjakt
          file: skattjakt/Dockerfile
          build-args: |
            BINARY=skattjakt-api
            WITH_OCR=1
          tags: skattjakt/api:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: skattjakt
          file: skattjakt/Dockerfile
          build-args: |
            BINARY=skattjakt-analysis-worker
            WITH_OCR=1
          tags: skattjakt/analysis-worker:ci
          load: true
          push: false
          cache-from: type=gha

      # Section 36: what the image must and must not contain. Asserted rather
      # than trusted to the base image staying what it is.
      - name: Inspect the image
        run: ./tests/supply-chain/inspect-image.sh skattjakt/api:ci

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skattjakt/api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
